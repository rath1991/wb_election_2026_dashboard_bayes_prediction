services:
  - type: web
    name: wb-elections-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    disk:
      name: wb-elections-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: DB_PATH
        value: /data/wb_elections.duckdb

  - type: cron
    name: wb-elections-pipeline
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "30 1 * * *"
    startCommand: python scheduler.py --once
    envVars:
      - key: ANTHROPIC_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: DB_PATH
        value: /data/wb_elections.duckdb
