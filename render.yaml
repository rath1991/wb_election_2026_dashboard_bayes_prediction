services:
  - type: web
    name: wb-elections-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    disk:
      name: wb-elections-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: DB_PATH
        value: /data/wb_elections.duckdb

  # Scheduler runs as background thread inside the web service (shares the same disk).
  # No separate cron service needed with DuckDB.
